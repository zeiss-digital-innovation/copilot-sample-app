<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Simple Task Manager</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-mark">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="52" height="52" rx="13" fill="#2563eb"/>
          <path d="M14 26 L22 34 L38 18" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>TaskFlow</h1>
      <p>Simple Task Management</p>
    </header>

    <main>
      <section class="task-form">
        <h2>Add New Task</h2>
        <form id="add-task-form">
          <div class="form-group">
            <label for="task-title">Title</label>
            <input type="text" id="task-title" name="title" required>
          </div>
          <div class="form-group">
            <label for="task-description">Description</label>
            <textarea id="task-description" name="description" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date" name="dueDate">
          </div>
          <button type="submit" class="btn btn-primary">Add Task</button>
        </form>
      </section>

      <section class="tasks-list">
        <div class="tasks-list-header">
          <h2>Tasks</h2>
        </div>
        <div id="tasks-container"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
